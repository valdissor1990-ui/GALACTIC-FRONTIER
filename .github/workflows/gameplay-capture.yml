name: 10-second gameplay capture

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/gameplay-10s-capture

permissions:
  contents: read

concurrency:
  group: gameplay-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Record real Godot gameplay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install virtual display and video encoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb ffmpeg
          godot --version
          ffmpeg -version | head -n 1

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Record exactly 10 seconds of gameplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xvfb-run -a -s "-screen 0 1600x900x24" bash -lc '
            set -euo pipefail
            godot --path . --windowed --resolution 1600x900 res://scenes/demo/gameplay_showcase.tscn --quit-after 900 > build/gameplay-showcase.log 2>&1 &
            game_pid=$!
            trap "kill $game_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              if grep -q "SHOWCASE_READY" build/gameplay-showcase.log; then break; fi
              sleep 0.25
            done
            grep -q "SHOWCASE_READY" build/gameplay-showcase.log
            sleep 1.5
            ffmpeg -y -hide_banner -loglevel error -f x11grab -framerate 30 -video_size 1600x900 -i "$DISPLAY" -t 10.0 -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p build/GALACTIC-FRONTIER-gameplay-10s.mp4
            wait "$game_pid" || { cat build/gameplay-showcase.log; exit 1; }
          '

      - name: Verify video duration and file
        run: |
          test -s build/GALACTIC-FRONTIER-gameplay-10s.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 build/GALACTIC-FRONTIER-gameplay-10s.mp4 | tee build/video-duration.txt
          awk '{ if ($1 < 9.9 || $1 > 10.1) exit 1 }' build/video-duration.txt
          grep -E "SHOWCASE_(READY|TARGET_ACQUIRED|SEQUENCE_COMPLETE)" build/gameplay-showcase.log || true

      - name: Upload gameplay video and run log
        uses: actions/upload-artifact@v4
        with:
          name: GALACTIC-FRONTIER-gameplay-10s
          path: |
            build/GALACTIC-FRONTIER-gameplay-10s.mp4
            build/video-duration.txt
            build/gameplay-showcase.log
          if-no-files-found: error
          retention-days: 30
