name: Release Windows Update Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build verified Windows update package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Validate tag and project version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = (Select-String -Path project.godot -Pattern '^config/version="([^"]+)"$').Matches.Groups[1].Value
          if ("v$version" -ne $tag) { throw "Tag $tag does not match project version v$version" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Import and validate project
        shell: pwsh
        run: |
          godot --headless --editor --path . --import --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed." }
          godot --headless --path . --script res://tests/update/test_update_manager.gd
          if ($LASTEXITCODE -ne 0) { throw "Updater regression tests failed." }

      - name: Export Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          godot --headless --path . --export-release "Windows Desktop" "build/GALACTIC-FRONTIER.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows export failed." }
          if (!(Test-Path build/GALACTIC-FRONTIER.pck)) { throw "PCK export missing." }

      - name: Create update archive and SHA-256 manifest
        shell: pwsh
        run: |
          Push-Location build
          Compress-Archive -Path GALACTIC-FRONTIER.exe, GALACTIC-FRONTIER.pck -DestinationPath GALACTIC-FRONTIER-windows-update.zip -CompressionLevel Optimal
          $hash = (Get-FileHash GALACTIC-FRONTIER-windows-update.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{ version = "$env:RELEASE_VERSION"; sha256 = $hash } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path $PWD "update-manifest.json"), $manifest, [System.Text.UTF8Encoding]::new($false))
          Pop-Location

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GALACTIC FRONTIER ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            build/GALACTIC-FRONTIER-windows-update.zip
            build/update-manifest.json
