name: Gameplay screenshot capture

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ten-minute-vertical-slice
      - chatgpt/ship-art-production
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - chatgpt/ten-minute-vertical-slice

permissions:
  contents: read

concurrency:
  group: gameplay-screenshot-capture-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    name: Render eight real gameplay screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and screenshot tools
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install virtual display and image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb python3-pil
          godot --version

      - name: Import runtime assets and validate scripts
        run: |
          find assets/models/ships -type f -name '*.blend' -delete
          godot --headless --editor --path . --import --quit

      - name: Render gameplay and save eight PNG screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          timeout 45s xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --windowed --resolution 1280x720 \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            res://scenes/demo/gameplay_showcase.tscn 2>&1 | tee build/gameplay-showcase.log

          screenshot_dir="$(find "$HOME/.local/share/godot/app_userdata" -type d -name screenshots -print -quit)"
          test -n "$screenshot_dir"
          cp "$screenshot_dir"/*.png build/screenshots/
          count="$(find build/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)"
          test "$count" -eq 8
          grep -q "SHOWCASE_READY" build/gameplay-showcase.log
          grep -Eq "SHOWCASE_PLAYER_MODEL_MESHES=[1-9][0-9]*" build/gameplay-showcase.log
          grep -Eq "SHOWCASE_ENEMY_MODEL_MESHES=[1-9][0-9]*" build/gameplay-showcase.log
          grep -q "SHOWCASE_TARGET_ACQUIRED=true" build/gameplay-showcase.log
          grep -q "SHOWCASE_SEQUENCE_COMPLETE" build/gameplay-showcase.log
          if grep -Eq "No loader found for resource|Parse Error:" build/gameplay-showcase.log; then
            echo "Godot failed to load a scene or GLB resource."
            exit 1
          fi

      - name: Build 960x1080 contact sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path("build/screenshots").glob("*.png"))
          assert len(files) == 8, f"Expected 8 screenshots, found {len(files)}"
          sheet = Image.new("RGB", (960, 1080), (8, 13, 22))
          for index, path in enumerate(files):
              with Image.open(path) as source:
                  frame = source.convert("RGB").resize((480, 270), Image.Resampling.LANCZOS)
              x = (index % 2) * 480
              y = (index // 2) * 270
              sheet.paste(frame, (x, y))
          sheet.save("build/GALACTIC-FRONTIER-contact-sheet.png", optimize=True)
          PY

      - name: Verify screenshot dimensions and contact sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path("build/screenshots").glob("*.png"))
          assert len(files) == 8
          for path in files:
              with Image.open(path) as image:
                  assert image.size == (1280, 720), f"{path}: {image.size}"
                  assert image.getbbox() is not None, f"{path}: blank image"
          with Image.open("build/GALACTIC-FRONTIER-contact-sheet.png") as sheet:
              assert sheet.size == (960, 1080), sheet.size
          print("SCREENSHOT_QA_PASS: 8 PNG files at 1280x720; contact sheet 960x1080")
          PY

      - name: Upload gameplay screenshots and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: GALACTIC-FRONTIER-gameplay-screenshots
          path: |
            build/screenshots/*.png
            build/GALACTIC-FRONTIER-contact-sheet.png
            build/gameplay-showcase.log
          if-no-files-found: error
          retention-days: 30
