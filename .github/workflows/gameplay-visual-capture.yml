name: Gameplay screenshot capture

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ten-minute-vertical-slice
      - chatgpt/ship-art-production
      - chatgpt/audit-fixes-pr24
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - chatgpt/ten-minute-vertical-slice
      - chatgpt/audit-fixes-pr24

permissions:
  contents: read

concurrency:
  group: gameplay-screenshot-capture-\${{ github.ref }}-\${{ github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    name: Render and inspect real gameplay screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot and screenshot tools
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install virtual display and image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb python3-pil
          godot --version

      - name: Import project and validate scripts
        run: |
          find assets/models/ships -type f -name '*.blend' -delete
          godot --headless --editor --path . --import --quit

      - name: Capture deterministic gameplay screenshots from the running game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          timeout 90s xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --windowed --resolution 1280x720 \
              --rendering-method gl_compatibility --rendering-driver opengl3 \
              res://scenes/demo/gameplay_showcase.tscn \
              > build/gameplay-showcase.log 2>&1
          grep -q "SHOWCASE_TARGET_ACQUIRED=true" build/gameplay-showcase.log
          grep -q "SHOWCASE_SEQUENCE_COMPLETE" build/gameplay-showcase.log
          screenshot_root="$(find "$HOME/.local/share/godot/app_userdata" -type f -name '01-flight-start.png' -print -quit)"
          if [ -z "$screenshot_root" ]; then
            cat build/gameplay-showcase.log
            echo "The showcase did not save its first deterministic screenshot."
            exit 1
          fi
          screenshot_dir="$(dirname "$screenshot_root")"
          names=(
            "01-flight-start.png"
            "02-relay-approach.png"
            "03-hostiles-arrive.png"
            "04-combat-targeting.png"
            "05-cockpit-view.png"
            "06-chase-combat.png"
            "07-mission-hud.png"
            "08-final-frame.png"
          )
          for i in "${!names[@]}"; do
            source="$screenshot_dir/${names[$i]}"
            test -s "$source"
            cp "$source" "build/screenshots/gameplay-$(printf '%02d' "$((i + 1))").png"
          done
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          files = sorted(Path("build/screenshots").glob("gameplay-*.png"))
          if len(files) != 8:
              raise SystemExit(f"Expected exactly 8 deterministic screenshots, got {len(files)}")
          thumbs = []
          for path in files:
              image = Image.open(path).convert("RGB")
              if image.size != (1280, 720):
                  raise SystemExit(f"{path.name}: unexpected size {image.size}")
              luminance = image.convert("L")
              mean = sum(luminance.getdata()) / (1280 * 720)
              if mean > 22.0:
                  raise SystemExit(f"{path.name}: likely splash/blank frame (mean luminance {mean:.1f})")
              thumbs.append(ImageOps.expand(image.resize((480, 270), Image.Resampling.LANCZOS), border=2, fill="white"))
          sheet = Image.new("RGB", (968, 1096), (8, 13, 24))
          for i, thumb in enumerate(thumbs):
              sheet.paste(thumb, (2 + (i % 2) * 484, 2 + (i // 2) * 274))
          sheet.save("build/gameplay-contact-sheet.png", optimize=True)
          print("SCREENSHOT_CAPTURE_PASS: 8 deterministic director captures + contact sheet")
          PY
      - name: Verify screenshot set and showcase sequence
        run: |
          set -euo pipefail
          test "$(find build/screenshots -maxdepth 1 -name 'gameplay-*.png' | wc -l)" -eq 8
          test -s build/gameplay-contact-sheet.png
          if grep -E "ERROR:.*(Failed loading resource|No loader found|Parse Error|referenced non-existent resource|Unable to open file)" build/gameplay-showcase.log; then
            echo "Gameplay scene contains missing or invalid resources."
            exit 1
          fi
          grep -E "SHOWCASE_(READY|TARGET_ACQUIRED|SEQUENCE_COMPLETE)" build/gameplay-showcase.log

      - name: Upload gameplay screenshots and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: GALACTIC-FRONTIER-gameplay-screenshots
          path: |
            build/screenshots/*.png
            build/gameplay-contact-sheet.png
            build/gameplay-showcase.log
          if-no-files-found: error
          retention-days: 30
