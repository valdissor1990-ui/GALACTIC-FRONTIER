name: Gameplay visual quality capture

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ten-minute-vertical-slice
      - chatgpt/ship-art-production
    paths:
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/gameplay-visual-capture.yml"

permissions:
  contents: read

concurrency:
  group: gameplay-visual-capture-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    name: Render and inspect real gameplay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install virtual display and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb ffmpeg python3-pil
          godot --version
          ffmpeg -version | head -n 1

      - name: Verify both original ship GLBs are present
        run: |
          test -s assets/models/ships/player_fighter.glb
          test -s assets/models/ships/enemy_fighter.glb
          test -s assets/models/ships/heavy_fighter.glb
          test -s assets/models/ships/bomber.glb
          test -s assets/models/ships/cargo_hauler.glb
          test -s assets/models/ships/frigate.glb
          test -s assets/models/ships/cruiser.glb

      - name: Import project and validate scripts and GLB resources
        run: godot --headless --editor --path . --import --quit

      - name: Capture eight real gameplay screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          xvfb-run -a -s "-screen 0 1280x720x24" bash -lc '
            set -euo pipefail
            godot --path . --windowed --resolution 1280x720 --rendering-method gl_compatibility --rendering-driver opengl3 res://scenes/demo/gameplay_showcase.tscn > build/gameplay-showcase.log 2>&1 &
            game_pid=$!
            trap "kill $game_pid 2>/dev/null || true" EXIT
            ready=0
            for attempt in $(seq 1 80); do
              if grep -q "SHOWCASE_READY" build/gameplay-showcase.log; then ready=1; break; fi
              if ! kill -0 "$game_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            if [ "$ready" -ne 1 ]; then cat build/gameplay-showcase.log; exit 1; fi
            for shot in $(seq -w 1 8); do
              sleep 2.5
              ffmpeg -y -hide_banner -loglevel error -f x11grab -video_size 1280x720 -i "$DISPLAY" -frames:v 1 "build/screenshots/gameplay-${shot}.png"
            done
            sleep 1
            kill -TERM "$game_pid" 2>/dev/null || true
            wait "$game_pid" 2>/dev/null || true
          '

      - name: Build and validate screenshot contact sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path("build/screenshots").glob("gameplay-*.png"))
          if len(files) != 8:
              raise SystemExit(f"Expected 8 screenshots, got {len(files)}")

          thumbs = []
          for path in files:
              image = Image.open(path).convert("RGB")
              if image.size != (1280, 720):
                  raise SystemExit(f"Unexpected screenshot size: {path} {image.size}")
              # Reject blank/near-blank captures, such as an empty black window.
              extrema = image.convert("L").getextrema()
              if extrema[1] - extrema[0] < 12:
                  raise SystemExit(f"Screenshot has almost no visual detail: {path}")
              thumbs.append(image.resize((480, 270)))

          sheet = Image.new("RGB", (960, 1080), "#10151d")
          for i, image in enumerate(thumbs):
              sheet.paste(image, ((i % 2) * 480, (i // 2) * 270))
          sheet.save("build/screenshots/contact-sheet.png")
          PY

      - name: Verify screenshots and gameplay sequence
        run: |
          test "$(find build/screenshots -maxdepth 1 -name 'gameplay-*.png' | wc -l)" -eq 8
          test -s build/screenshots/contact-sheet.png
          file build/screenshots/gameplay-*.png
          grep -E "SHOWCASE_PLAYER_MODEL_MESHES=[1-9][0-9]*" build/gameplay-showcase.log
          grep -E "SHOWCASE_ENEMY_MODEL_MESHES=[1-9][0-9]*" build/gameplay-showcase.log
          grep -E "SHOWCASE_(READY|TARGET_ACQUIRED|SEQUENCE_COMPLETE)" build/gameplay-showcase.log
          if grep -E "No loader found|Parse Error|modified from inside an instance" build/gameplay-showcase.log; then
            echo "Gameplay visual capture contains broken GLB resources or scene overrides."
            exit 1
          fi

      - name: Upload gameplay screenshots and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: GALACTIC-FRONTIER-gameplay-visual-qa
          path: |
            build/screenshots/*.png
            build/gameplay-showcase.log
          if-no-files-found: error
          retention-days: 30
