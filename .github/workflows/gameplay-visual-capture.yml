name: Gameplay visual quality capture

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ten-minute-vertical-slice
      - chatgpt/ship-art-production
      - chatgpt/fullhd-showcase-qa
      - chatgpt/cockpit-camera-polish
    paths:
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/gameplay-visual-capture.yml"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - chatgpt/ten-minute-vertical-slice
      - chatgpt/ship-art-production
      - chatgpt/audit-fixes-pr24
      - chatgpt/mission-save-integration
      - chatgpt/campaign-objectives
      - chatgpt/campaign-story-integration
    paths:
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/gameplay-visual-capture.yml"

permissions:
  contents: read

concurrency:
  group: gameplay-visual-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Render and inspect real gameplay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install virtual display and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb python3-pil libvulkan1 mesa-vulkan-drivers vulkan-tools
          godot --version
          xvfb-run -a vulkaninfo --summary

      - name: Verify all seven original ship GLBs are present
        run: |
          for ship in player_fighter enemy_fighter heavy_fighter bomber cargo_hauler frigate cruiser; do
            test -s "assets/models/ships/${ship}.glb"
          done

      - name: Import project and validate scripts and GLB resources
        run: godot --headless --editor --path . --import --quit

      - name: Capture eight deterministic Full HD gameplay screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -lc '
            set -euo pipefail
            godot --path . --windowed --resolution 1920x1080 --rendering-method forward_plus --rendering-driver vulkan res://scenes/demo/gameplay_showcase.tscn > build/gameplay-showcase.log 2>&1 &
            game_pid=$!
            trap "kill $game_pid 2>/dev/null || true" EXIT
            ready=0
            for attempt in $(seq 1 600); do
              if grep -q "SHOWCASE_SEQUENCE_COMPLETE" build/gameplay-showcase.log; then ready=1; break; fi
              if ! kill -0 "$game_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            app_data="$HOME/.local/share/godot/app_userdata/GALACTIC FRONTIER/screenshots"
            test -d "$app_data"
            cp "$app_data"/gameplay-*.png build/screenshots/ 2>/dev/null || true
            cp "$app_data"/carrier-services.png build/screenshots/ 2>/dev/null || true
            cp "$app_data"/contract-board.png build/screenshots/ 2>/dev/null || true
            if [ "$ready" -ne 1 ]; then
              echo "Showcase did not finish within 150 seconds; captured $(find build/screenshots -maxdepth 1 -name "gameplay-*.png" | wc -l) screenshots."
              cat build/gameplay-showcase.log
              exit 1
            fi
            if ! grep -Eq "Vulkan [0-9]" build/gameplay-showcase.log || ! grep -q "Forward+" build/gameplay-showcase.log; then
              echo "Visual QA did not use the required Forward+ Vulkan renderer."
              cat build/gameplay-showcase.log
              exit 1
            fi
            test "$(find build/screenshots -maxdepth 1 -name "gameplay-*.png" | wc -l)" -eq 8
            kill -TERM "$game_pid" 2>/dev/null || true
            wait "$game_pid" 2>/dev/null || true
          '

      - name: Capture seven orbital space views from different camera angles
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -lc '
            set -euo pipefail
            godot --path . --windowed --resolution 1920x1080 --rendering-method forward_plus --rendering-driver vulkan res://scenes/demo/space_environment_showcase.tscn > build/space-showcase.log 2>&1 &
            game_pid=$!
            trap "kill $game_pid 2>/dev/null || true" EXIT
            ready=0
            for attempt in $(seq 1 240); do
              if grep -q "SPACE_SHOWCASE_COMPLETE count=7" build/space-showcase.log; then ready=1; break; fi
              if ! kill -0 "$game_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            app_data="$HOME/.local/share/godot/app_userdata/GALACTIC FRONTIER/screenshots"
            test -d "$app_data"
            cp "$app_data"/space-*.png build/screenshots/ 2>/dev/null || true
            if [ "$ready" -ne 1 ]; then
              cat build/space-showcase.log
              exit 1
            fi
            if ! grep -Eq "Vulkan [0-9]" build/space-showcase.log || ! grep -q "Forward+" build/space-showcase.log; then
              echo "Space showcase did not use the required Forward+ Vulkan renderer."
              cat build/space-showcase.log
              exit 1
            fi
            test "$(find build/screenshots -maxdepth 1 -name "space-*.png" | wc -l)" -eq 7
            kill -TERM "$game_pid" 2>/dev/null || true
            wait "$game_pid" 2>/dev/null || true
          '

      - name: Capture seven-ship Full HD hangar lineup in Godot
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -lc '
            set -euo pipefail
            godot --path . --windowed --resolution 1920x1080 --rendering-method forward_plus --rendering-driver vulkan res://scenes/demo/fleet_hangar_showcase.tscn > build/fleet-hangar.log 2>&1 &
            game_pid=$!
            trap "kill $game_pid 2>/dev/null || true" EXIT
            ready=0
            for attempt in $(seq 1 240); do
              if grep -q "FLEET_HANGAR_COMPLETE" build/fleet-hangar.log; then ready=1; break; fi
              if ! kill -0 "$game_pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            app_data="$HOME/.local/share/godot/app_userdata/GALACTIC FRONTIER/screenshots"
            test -d "$app_data"
            cp "$app_data/fleet-hangar.png" build/screenshots/ 2>/dev/null || true
            if [ "$ready" -ne 1 ]; then
              cat build/fleet-hangar.log
              exit 1
            fi
            if ! grep -Eq "Vulkan [0-9]" build/fleet-hangar.log || ! grep -q "Forward+" build/fleet-hangar.log; then
              echo "Hangar capture did not use the required Forward+ Vulkan renderer."
              cat build/fleet-hangar.log
              exit 1
            fi
            test -s build/screenshots/fleet-hangar.png
            kill -TERM "$game_pid" 2>/dev/null || true
            wait "$game_pid" 2>/dev/null || true
          '

      - name: Build and validate screenshot contact sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path("build/screenshots").glob("gameplay-*.png"))
          if len(files) != 8:
              raise SystemExit(f"Expected 8 screenshots, got {len(files)}")

          thumbs = []
          for path in files:
              image = Image.open(path).convert("RGB")
              if image.size != (1920, 1080):
                  raise SystemExit(f"Unexpected screenshot size: {path} {image.size}")
              extrema = image.convert("L").getextrema()
              if extrema[1] - extrema[0] < 12:
                  raise SystemExit(f"Screenshot has almost no visual detail: {path}")
              thumbs.append(image.resize((480, 270)))

          sheet = Image.new("RGB", (960, 1080), "#10151d")
          for i, image in enumerate(thumbs):
              sheet.paste(image, ((i % 2) * 480, (i // 2) * 270))
          sheet.save("build/screenshots/contact-sheet.png")

          space_files = sorted(Path("build/screenshots").glob("space-*.png"))
          if len(space_files) != 7:
              raise SystemExit(f"Expected 7 space views, got {len(space_files)}")
          space_sheet = Image.new("RGB", (1920, 1080), "#10151d")
          for i, path in enumerate(space_files):
              image = Image.open(path).convert("RGB")
              if image.size != (1920, 1080):
                  raise SystemExit(f"Unexpected space screenshot size: {path} {image.size}")
              space_sheet.paste(image.resize((640, 360)), ((i % 3) * 640, (i // 3) * 360))
          space_sheet.save("build/screenshots/space-contact-sheet.png")
          PY

      - name: Verify full mission sequence and screenshot evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          screenshots = Path("build/screenshots")
          gameplay = sorted(screenshots.glob("gameplay-*.png"))
          space = sorted(path for path in screenshots.glob("space-*.png") if path.name != "space-contact-sheet.png")
          required = [
              "contact-sheet.png", "space-contact-sheet.png", "fleet-hangar.png",
              "carrier-services.png", "contract-board.png"
          ]
          if len(gameplay) != 8:
              raise SystemExit(f"Expected 8 gameplay frames, got {len(gameplay)}")
          if len(space) != 7:
              raise SystemExit(f"Expected 7 space frames, got {len(space)}")
          for name in required:
              path = screenshots / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing screenshot evidence: {name}")
          for path in gameplay + space + [screenshots / "fleet-hangar.png", screenshots / "carrier-services.png", screenshots / "contract-board.png"]:
              with Image.open(path) as image:
                  if image.size != (1920, 1080):
                      raise SystemExit(f"Unexpected Full HD size: {path} {image.size}")

          gameplay_log = Path("build/gameplay-showcase.log").read_text(errors="replace")
          fleet_log = Path("build/fleet-hangar.log").read_text(errors="replace")
          for marker in [
              "SHOWCASE_PLAYER_MODEL_MESHES=", "SHOWCASE_ENEMY_MODEL_MESHES=",
              "SHOWCASE_PHASE=RELAY_APPROACH", "SHOWCASE_PHASE=RELAY_COMBAT",
              "SHOWCASE_PHASE=WRECK_INVESTIGATION", "SHOWCASE_PHASE=WRECK_COMBAT",
              "SHOWCASE_PHASE=MISSION_COMPLETE", "SHOWCASE_SEQUENCE_COMPLETE stage=7"
          ]:
              if marker not in gameplay_log:
                  raise SystemExit(f"Missing gameplay QA marker: {marker}")
          if gameplay_log.count("SHOWCASE_SCREENSHOT=") != 10:
              raise SystemExit("Gameplay showcase did not capture all 10 frames")
          if "FLEET_HANGAR_SHIPS_LOADED=7" not in fleet_log or "FLEET_HANGAR_COMPLETE" not in fleet_log:
              raise SystemExit("Seven-ship hangar showcase did not complete")
          print(f"VISUAL_QA_PASS gameplay={len(gameplay)} space={len(space)} resolution=1920x1080")
          PY

      - name: Upload Full HD gameplay screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GALACTIC-FRONTIER-gameplay-visual-qa-fullhd
          path: |
            build/screenshots/*.png
            build/gameplay-showcase.log
            build/fleet-hangar.log
          if-no-files-found: error
          retention-days: 30
