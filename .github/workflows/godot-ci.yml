name: Godot CI

on:
  push:
    branches:
      - phase-1/flight-prototype
  pull_request:
    branches:
      - main
      - phase-1/flight-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-validation:
    name: Godot 4.7.2 validation and Windows export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2-stable and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify engine version
        run: |
          godot --version
          godot --version | grep -E '^4\.7\.2\.stable'

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Run FlightModel unit tests
        if: hashFiles('tests/flight/test_flight_model.gd') != ''
        run: godot --headless --path . --script res://tests/flight/test_flight_model.gd

      - name: Headless bootstrap-scene smoke test
        run: godot --headless --path . --quit-after 10

      - name: Headless flight-scene smoke test
        run: godot --headless --path . res://scenes/flight/test_flight.tscn --quit-after 8

      - name: Export Windows Desktop build
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/GALACTIC-FRONTIER.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GALACTIC-FRONTIER-windows-${{ github.sha }}
          path: |
            build/GALACTIC-FRONTIER.exe
            build/GALACTIC-FRONTIER.pck
          if-no-files-found: error
          retention-days: 14

  blender-asset-validation:
    name: Blender player-fighter asset generation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender
          blender --version

      - name: Generate editable model, Godot glTF and render preview
        run: |
          mkdir -p build/blender
          blender --background --python scripts/blender/build_player_fighter.py -- --output-dir build/blender

      - name: Validate generated model files
        run: |
          test -s build/blender/player_fighter.blend
          test -s build/blender/player_fighter.glb
          test -s build/blender/player_fighter_preview.png
          file build/blender/player_fighter.blend
          file build/blender/player_fighter.glb
          file build/blender/player_fighter_preview.png

      - name: Upload Blender model and preview
        uses: actions/upload-artifact@v4
        with:
          name: GALACTIC-FRONTIER-player-fighter-blender
          path: |
            build/blender/player_fighter.blend
            build/blender/player_fighter.glb
            build/blender/player_fighter_preview.png
          if-no-files-found: error
          retention-days: 30

  windows-executable-smoke-test:
    name: Windows executable smoke test
    runs-on: windows-latest
    needs: godot-validation
    timeout-minutes: 10
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: GALACTIC-FRONTIER-windows-${{ github.sha }}
          path: build

      - name: Launch exported game in headless smoke-test mode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $game = Start-Process -FilePath ".\\build\\GALACTIC-FRONTIER.exe" -ArgumentList @("--headless", "--quit-after", "10") -Wait -PassThru
          if ($game.ExitCode -ne 0) {
            throw "Windows executable exited with code $($game.ExitCode)"
          }
