name: Blender Fleet Asset Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - chatgpt/ten-minute-vertical-slice
    paths:
      - "scripts/blender/**"
      - "tests/assets/**"
      - "assets/models/ships/**"
      - "assets/previews/**"
      - ".github/workflows/blender-fleet-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-fleet-global
  cancel-in-progress: false

jobs:
  build-fleet:
    timeout-minutes: 40
    name: Build, validate and package seven-class fleet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install Blender 4.5.16
        run: |
          sudo apt-get update
          sudo apt-get install --yes xz-utils file libegl1 libgl1 libxkbcommon0 libxrender1 libxi6 libxfixes3 libx11-6 libxxf86vm1
          curl -fL "https://download.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /opt/blender
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          blender --version
      - name: Generate player fighter
        run: |
          mkdir -p build/blender
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python scripts/blender/build_player_fighter.py -- --output-dir build/blender
      - name: Generate distinct Raider interceptor
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python scripts/blender/build_enemy_interceptor.py -- --output-dir build/blender
      - name: Generate five additional fleet classes
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python scripts/blender/build_fleet_expansion.py -- --output-dir build/blender
      - name: Validate all Blender outputs
        run: |
          for f in player_fighter.blend player_fighter.glb player_fighter_preview.png enemy_fighter.blend enemy_fighter.glb enemy_fighter_preview.png heavy_fighter.blend heavy_fighter.glb heavy_fighter_preview.png bomber.blend bomber.glb bomber_preview.png cargo_hauler.blend cargo_hauler.glb cargo_hauler_preview.png frigate.blend frigate.glb frigate_preview.png cruiser.blend cruiser.glb cruiser_preview.png; do test -s "build/blender/$f"; done
          file build/blender/*.glb
          file build/blender/*preview.png
      - name: Validate generated Blender, GLB and preview outputs
        run: |
          blender --background --python scripts/blender/validate_fleet_assets.py -- --output-dir build/blender --report build/blender/validation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/blender/validation.json').read_text())
          if report.get('status') != 'PASS' or report.get('ships_passed') != 7 or report.get('ships_failed'):
              raise SystemExit('Fleet asset validation failed: ' + json.dumps(report.get('ships_failed', [])))
          print('BLENDER_FLEET_VALIDATION_PASS: 7/7 ships')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: galactic-frontier-ship-fleet
          path: |
            build/blender/player_fighter.blend
            build/blender/player_fighter.glb
            build/blender/player_fighter_preview.png
            build/blender/enemy_fighter.blend
            build/blender/enemy_fighter.glb
            build/blender/enemy_fighter_preview.png
            build/blender/heavy_fighter.blend
            build/blender/heavy_fighter.glb
            build/blender/heavy_fighter_preview.png
            build/blender/bomber.blend
            build/blender/bomber.glb
            build/blender/bomber_preview.png
            build/blender/cargo_hauler.blend
            build/blender/cargo_hauler.glb
            build/blender/cargo_hauler_preview.png
            build/blender/frigate.blend
            build/blender/frigate.glb
            build/blender/frigate_preview.png
            build/blender/cruiser.blend
            build/blender/cruiser.glb
            build/blender/cruiser_preview.png
            build/blender/validation.json
          if-no-files-found: error
          retention-days: 30
