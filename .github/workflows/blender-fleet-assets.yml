name: Blender Fleet Asset Build

on:
  push:
    branches:
      - chatgpt/ten-minute-vertical-slice
    paths:
      - "scripts/blender/**"
      - ".github/workflows/blender-fleet-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-fleet-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-fleet:
    timeout-minutes: 20
    name: Build and publish player and Raider ships
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Blender 4.5.16
        run: |
          sudo apt-get update
          sudo apt-get install --yes xz-utils file libegl1 libgl1 libxkbcommon0 libxrender1 libxi6 libxfixes3 libx11-6 libxxf86vm1
          curl -fL "https://download.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /opt/blender
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          blender --version
      - name: Generate player fighter
        run: |
          mkdir -p build/blender
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python scripts/blender/build_player_fighter.py -- --output-dir build/blender
      - name: Generate distinct Raider interceptor
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python scripts/blender/build_enemy_interceptor.py -- --output-dir build/blender
      - name: Validate all Blender outputs
        run: |
          for f in player_fighter.blend player_fighter.glb player_fighter_preview.png enemy_fighter.blend enemy_fighter.glb enemy_fighter_preview.png; do test -s "build/blender/$f"; done
          file build/blender/*.glb
          file build/blender/*preview.png
      - name: Publish generated ship assets
        run: |
          mkdir -p assets/models/ships assets/previews
          cp build/blender/player_fighter.blend assets/models/ships/player_fighter.blend
          cp build/blender/player_fighter.glb assets/models/ships/player_fighter.glb
          cp build/blender/player_fighter_preview.png assets/previews/player_fighter_preview.png
          cp build/blender/enemy_fighter.blend assets/models/ships/enemy_fighter.blend
          cp build/blender/enemy_fighter.glb assets/models/ships/enemy_fighter.glb
          cp build/blender/enemy_fighter_preview.png assets/previews/enemy_fighter_preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/ships assets/previews
          if git diff --cached --quiet; then echo "Ship assets unchanged."; else git commit -m "Build distinct player and Raider ship assets"; git push origin "HEAD:${GITHUB_REF_NAME}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: galactic-frontier-ship-fleet
          path: |
            build/blender/player_fighter.blend
            build/blender/player_fighter.glb
            build/blender/player_fighter_preview.png
            build/blender/enemy_fighter.blend
            build/blender/enemy_fighter.glb
            build/blender/enemy_fighter_preview.png
          if-no-files-found: error
          retention-days: 30
